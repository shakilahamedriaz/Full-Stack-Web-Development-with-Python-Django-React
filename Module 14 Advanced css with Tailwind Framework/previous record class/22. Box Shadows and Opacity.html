<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/output.css">
    <title>Document</title>
</head>
<body>
       <!-- Box Shadows and Opacity-->

        <h1 class="text-3xl font-bold">Box Shadows</h1>
        <div class="shadow-sm p-4 mb-4">Small Shadow</div>
        <div class="shadow p-4 mb-4">Default Shadow</div>
        <div class="shadow-lg p-4 mb-4">Large Shadow</div>
        <div class="shadow-xl p-4 mb-4">Extra Large Shadow</div>
        <div class="shadow-2xl p-4 mb-4">2X Large Shadow</div>
        <div class="shadow-inner p-4 mb-4">Inner Shadow</div>
        <div class="shadow-outline p-4 mb-4">Outline Shadow</div>

        
        <div class="p-4 inset- shadow-lg bg-green-400 w-60 h-40 rounded-lg">
            <h1 class="text-2xl font-bold">Shadow here</h1>
            <p class="inset-shadow-sm inset-shadow-red-500">Lorem ipsum dolor sit amet.</p>
        </div>


        

        <!-- Opacity -->
        <h1 class="text-3xl font-bold">Opacity</h1>
        <div class="bg-blue-500 opacity-50 p-4 mb-4">50% Opacity</div>
        <div class="bg-red-500 opacity-75 p-4 mb-4">75% Opacity</div>
        <div class="bg-green-500 opacity-25 p-4 mb-4">25% Opacity</div> 


</body>
</html>
