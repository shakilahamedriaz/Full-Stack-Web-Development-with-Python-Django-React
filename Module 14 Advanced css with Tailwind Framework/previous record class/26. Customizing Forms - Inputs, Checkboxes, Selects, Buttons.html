<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/output.css">
    <title>Document</title>
</head>
<body class="container mx-auto">
     <div class="mt-5">
         <input type="text" placeholder="Title" class="border-3 border-blue-300 rounded-md p-2 text-red-400 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-amber-100">
     </div>

      <!--Chekbox-->
        <div class="mt-5">
             <input type="checkbox" id="checkbox" class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 focus:ring-2" checked>
             <label for="checkbox" class="ml-2 text-sm font-medium text-gray-900">Checkbox</label>
        </div>

        <!--Radio-->
        <div class="mt-5">
             <input type="radio" id="radio" name="radio" class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 focus:ring-2" checked>
             <label for="radio" class="ml-2 text-sm font-medium text-gray-900">Radio</label>
        </div>      

        <!--Select-->
        <div class="mt-5">
             <select class="border-3 border-blue-300 rounded-md p-2 text-red-400 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-amber-100">
                 <option value="option1">Option 1</option>
                 <option value="option2">Option 2</option>
                 <option value="option3">Option 3</option>
             </select>

        </div>
        <!--Button-->
        <div class="mt-5">
             <button class="bg-blue-500 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">Button</button>
        </div>                          

        <!--Button with icon-->

        <div class="mt-5">
             <button class="bg-blue-500 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 flex items-center">
                 <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v8m0 0l4-4m-4 4l-4-4"></path></svg>
                 Button with Icon
             </button>


        </div>          
        <!--Button with icon and text-->
        <div class="mt-5">
             <button class="bg-blue-500 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 flex items-center">
                 <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v8m0 0l4-4m-4 4l-4-4"></path></svg>
                 Button with Icon and Text
             </button>
        </div>




</body>
</html>
