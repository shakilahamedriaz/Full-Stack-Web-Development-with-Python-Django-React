<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/output.css">
    <title>Cursor, Pointer Events, and User Select Demo</title>
</head>
<body class="container mx-auto p-8 space-y-8">
    <!-- Cursor Types Section -->
    <section class="space-y-4">
        <h2 class="text-2xl font-bold mb-4">Cursor Types</h2>
        
        <!-- Cursor Pointer -->
        <div>
            <button class="cursor-pointer bg-purple-500 text-white px-4 py-2 rounded-full hover:bg-purple-600">
                Pointer Cursor
            </button>
        </div>

        <!-- Cursor Progress -->
        <div>
            <button class="cursor-progress bg-purple-500 text-white px-4 py-2 rounded-full">
                Progress Cursor
            </button>
        </div>

        <!-- Cursor Not Allowed -->
        <div>
            <button class="cursor-not-allowed bg-purple-500 text-white px-4 py-2 rounded-full opacity-75">
                Not Allowed Cursor
            </button>
        </div>
    </section>

    <!-- Pointer Events Section -->
    <section class="space-y-4">
        <h2 class="text-2xl font-bold mb-4">Pointer Events</h2>
        <div>
            <button class="pointer-events-none bg-purple-500 text-white px-4 py-2 rounded-full opacity-75">
                No Pointer Events
            </button>
        </div>
    </section>

    <!-- User Select Section -->
    <section class="space-y-4">
        <h2 class="text-2xl font-bold mb-4">User Select</h2>
        <div class="max-w-md">
            <p class="select-none p-4 bg-gray-100 rounded">
                This text cannot be selected. Lorem ipsum dolor sit amet consectetur adipisicing elit.
            </p>
            <p class="select-text p-4 bg-gray-100 rounded mt-4">
                This text can be selected. Lorem ipsum dolor sit amet consectetur adipisicing elit.
            </p>
        </div>
    </section>
</body>
</html>
