<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/output.css">
    <title>Document</title>
</head>
<body>
       <!-- Flexbox Col: column wise sajano -->
       <h1 class="text-2xl">flex-col:</h1>
       <div class="flex flex-col gap-4">

          <div class="bg-blue-500 text-white p-4">Item 1</div>
          <div class="bg-yellow-500 text-white p-4">Item 1</div>
          <div class="bg-green-500 text-white p-4">Item 1</div>

       </div>
       <br><br>

        <!-- Flexbox row: Row wise sajano -->
        <h1 class="text-2xl">flex-row:</h1>
         <div class="flex flex-row gap-4"> <!--default means , default : felx -->
    
             <div class="bg-blue-500 text-white p-4">Item 1</div>
             <div class="bg-yellow-500 text-white p-4">Item 2</div>
             <div class="bg-green-500 text-white p-4">Item 3</div>

         </div>
         <br><br>


         <!--Flexbox Reverse: ulta vbe sajano-->
         <h1 class="text-2xl">flex-reverse:</h1>
         <div class="flex flex-col-reverse gap-4">

            <div class="bg-blue-500 text-white p-4">Item 1</div>
            <div class="bg-yellow-500 text-white p-4">Item 2</div>
            <div class="bg-green-500 text-white p-4">Item 3</div>

         </div> 
         <br><br>


        <!--Flexbox grow: boro kora, customized-->
        <h1 class="text-2xl">flex-grow:</h1>
         <div class="flex felx-row gap-4 ">

            <div class="bg-blue-500 text-white p-4 flex-grow">flex-grow</div> <!--grow -->
            <div class="bg-yellow-500 text-white p-4">Item 2</div>
            <div class="bg-green-500 text-white p-4">Item 3</div>
         </div>
         <br><br>



         <!--Flexbox shrink: choto kora-->
         <h1 class="text-2xl">flex-shrink:</h1>
         <div class="flex flex-row gap-4 text-white"> 

             <div class="bg-red-600 p-6 flex-grow ">One</div>  <!-- Won't shrink -->
             <div class="bg-indigo-500 p-6 flex-shrink ">flex-shrink</div>  <!-- Will shrink -->
             <div class="bg-sky-400 p-6 flex-grow">Three</div> <!-- Won't shrink -->
             
         </div>
         <br><br>



         <!--Flexbox Basis: Default size nirdharon-->
         <h1 class="text-2xl">flex-basis:</h1>
         <div class="flex">

            <div class="bg-red-600 p-6 basis-1/3">1/3</div>  
            <div class="bg-indigo-500 p-6 basis-1/3 ">1/3</div>  
            <div class="bg-sky-400 p-6 basis-0">default</div>

         </div>
         <br><br>



       <!--Flexbox Wrap: wraping customization: ekadik item nihce chole ashbe-->
         <h1 class="text-2xl">flex-warp: and flex order</h1>
         <div class="flex flex-wrap text-white">

            <div class="bg-red-600 p-6 w-1/3 order-2">One</div>  
            <div class="bg-indigo-500 p-6 w-1/3 order-4">Two</div>  
            <div class="bg-sky-400 p-6 w-1/3 order-1">Three</div>
            <div class="bg-black p-6 w-1/3 order-3">Three</div>

         </div>
  

</body>
</html>
