<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/output.css">
    <title>Document</title>
</head>
<body>
    <!--Hover : -->
      <button class="bg-pink-600 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded cursor-pointer">Hover me</button>

      <br><br>

    <!--Focus : -->
      <input type="text" class="border border-gray-200 focus:border-amber-500 focus:ring-2 outline-none">

      <br><br>

    <!--Active : -->
      <button class="bg-green-500 hover:bg-pink-600 active:bg-white rounded px-5px py-5px ">Click Me</button>

      <br><br>
    
    <!--Disabled : -->
      <button class="bg-gray-600 text-white disabled:opacity-100 " disabled>Disable</button>

      <br><br>
      
    <!--Group : -->
      <div class="group p-[20px] bg-gray-200 hover:bg-yellow-500">

           <h1 class="group-hover:text-white">This is Cart</h1>
           <p class="group-hover:text-red-400">This is a simple website, with nothing</p>
           <p class="group-hover:text-blue-700">Feel free to play with this section where you gonna learn</p>

      </div>

</body>
</html>
