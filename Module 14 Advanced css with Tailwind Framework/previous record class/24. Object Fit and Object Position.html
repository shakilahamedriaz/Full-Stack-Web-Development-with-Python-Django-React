<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/output.css">
    <title>Document</title>
</head>
<body>
        <!-- Object Fit and Object Position -->
        <h1 class="text-3xl font-bold">Object Fit</h1>
        <div class="flex gap-4">
            <img src="https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080" alt="Image" class="object-contain w-32 h-32">
            <img src="https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080" alt="Image" class="object-cover w-32 h-32">
            <img src="https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080" alt="Image" class="object-fill w-32 h-32">
        </div>



        <h1 class="text-3xl font-bold mt-8">Object Position</h1>
        <div class="flex gap-4">

            <img src="https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080" alt="Image" class="object-top w-32 h-32">

            <img src="https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080" alt="Image" class="object-bottom w-32 h-32">
            <img src="https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080" alt="Image" class="object-left w-32 h-32">
        </div> 
        <br><br>


        <div class="w-[500px] h-[500px]  border border-gray-900 overflow-hidden">
            <img class="object-fit-fit w-full h-full" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTfdZHQXGckDjObTkFuMTtsQjfQNH1XRwamHw&s" alt="shakil image">
        </div>   
</body>
</html>
