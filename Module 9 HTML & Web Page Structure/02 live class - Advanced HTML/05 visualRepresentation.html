<!--Here’s a simple visual representation of a symmetrical 
HTML layout using semantic elements like <header>, <main>, 
<footer>, <aside>, etc.-->



+--------------------------------------+
|              HEADER                  |
+--------------------------------------+
|      |                        |      |
| ASIDE|         MAIN           |ASIDE |
|      |                        |      |
+--------------------------------------+
|             FOOTER                   |
+--------------------------------------+


<!--
Explanation:
<header> → Represents the top section (like a navbar or title).

<main> → The central content area.

<aside> → Sidebars, which can contain additional information (menus, ads, etc.).

<footer> → The bottom section of the page.

<div class="container"> → Wraps everything and uses flexbox to align sections.
-->
