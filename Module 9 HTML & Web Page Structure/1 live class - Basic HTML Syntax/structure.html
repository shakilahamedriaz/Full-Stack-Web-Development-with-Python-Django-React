<!--Explaination of this structure here: -->


<!DOCTYPE html> 
<!-- Declares HTML5 document type -->
<!-- Keynote: Defines document as HTML5 -->

<html lang="en"> 
<!-- Root element of the HTML document, language set to English -->
<!-- Keynote: Starts HTML and sets language -->

<head> 
<!-- Contains metadata (that is not visible to webpage ) and links to external resources -->
<!-- Keynote: Head section for page info -->

    <meta charset="UTF-8"> 
    <!-- Defines character encoding to support all text characters -->
    <!-- Keynote: Ensures proper text display -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <!-- Makes the website responsive for different screen sizes -->
    <!-- Keynote: Enables mobile-friendly design -->

    <title>My webpage</title> 
    <!-- Sets the title of the web page (shown on the browser tab) -->
    <!-- Keynote: Defines page title -->

</head> 
<!-- Closes head section -->
<!-- Keynote: End of head section -->

<body> 
<!-- Contains visible webpage content -->
<!-- Keynote: Start of webpage content -->

</body> 
<!-- Closes body section -->
<!-- Keynote: End of webpage content -->

</html> 
<!-- Closes HTML document -->
<!-- Keynote: End of the HTML document -->
