<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <label for="country">Select Country: </label>
    <select name="country" id="country">
        <option value="Bangladesh">BD</option>
        <option value="United Kingdom">UK</option>
        <option value="United State of America">USA</option>
        <option value="Italy">Italy</option>
    </select>
    <br><br>


    <label for="fruit">Select fruit; </label> <br><br>

    <input type="radio" id="apple" name="fruit" value="apple">
    <label for="apple">Apple</label>
    <br>
    <input type="radio" id="banana" name="fruit" value="banana">
    <label for="banana">Banana</label>
    <br>
    <input type="radio" id="mango" name="fruit" value="mango">
    <label for="mango">Mango</label>

    <br><br>

    <label for="sport">Select Favourtie Game: </label><br><br>

    <input type="checkbox" id="cricket" name="sport" value="Cricket">
    <label for="cricket">Cricket</label>
    <br>
    <input type="checkbox" id="football" name="sport" value="Football">
    <label for="Football">Football</label>



</body>
</html>
