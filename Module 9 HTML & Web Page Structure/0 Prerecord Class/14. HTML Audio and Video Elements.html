<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <audio controls>
          <source src="asset/river and bird.mp4" type="audio/mpeg">
          Your Browser Does not Support the audio Element. <!--Exception message-->
    </audio>


    <video controls width="400" height="300" autoplay muted poster="asset/image.png" loop>
         <source src="asset/river and bird.mp4" type="video/mp4">
         Your browser dosent suport the video element
    </video>


    <!--Controls -> We can control, puse, resume, volume control, etc

    
    #Common Attributes:
    src – Specifies the file URL (required for both).

    controls – Adds play, pause, and volume controls.

    autoplay – Starts playback automatically.

    muted – Mutes the audio/video by default.

    loop – Repeats the media indefinitely.

    poster (for video) – Displays an image before the video plays.

    width & height (for video) – Defines the dimensions
    
    
    
    -->


</body>
</html>
