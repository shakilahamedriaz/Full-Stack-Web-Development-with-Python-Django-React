<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> <!-- Specifies character encoding for proper text rendering -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ensures responsive design for different devices -->
    <meta name="description" content="এটি একটি HTML Meta Tags and টিউটোরিয়াল"> <!-- Provides a brief description of the page for SEO -->
    <meta name="keywords" content="HTML, Meta Tags, SEO, Bangla Tutorial"> <!-- Keywords for search engines (less used in modern SEO) -->
    <meta name="author" content="Your name"> <!-- Specifies the author of the document -->
    <meta http-equiv="refresh" content="5; url=https://google.com"> <!-- Redirects the page after 5 seconds -->
    <meta name="robots" content="index, follow"> <!-- Tells search engines to index the page and follow links -->
    
    <!-- Open Graph Meta Tags for better social media sharing -->
    <meta property="og:title" content="HTML Meta Tags and SEO"> <!-- Defines the title when shared on social media -->
    <meta property="og:description" content="Learn about important HTML meta tags for SEO optimization."> <!-- Description for social sharing -->
    <meta property="og:image" content="https://example.com/meta-image.jpg"> <!-- Thumbnail image for social sharing -->
    <meta property="og:url" content="https://example.com"> <!-- Canonical URL for social media -->
    <meta property="og:type" content="website"> <!-- Defines the type of content (e.g., article, website) -->
    
    <!-- Twitter Card Meta Tags for Twitter sharing -->
    <meta name="twitter:card" content="summary_large_image"> <!-- Defines the type of Twitter card -->
    <meta name="twitter:title" content="HTML Meta Tags and SEO"> <!-- Twitter post title -->
    <meta name="twitter:description" content="Learn about important HTML meta tags for SEO optimization."> <!-- Twitter post description -->
    <meta name="twitter:image" content="https://example.com/meta-image.jpg"> <!-- Twitter post image -->
    
    <!-- Canonical Tag to prevent duplicate content issues -->
    <link rel="canonical" href="https://example.com"> <!-- Specifies the preferred URL version for SEO -->
    
    <!-- Favicon for website branding -->
    <link rel="icon" href="favicon.ico" type="image/x-icon"> <!-- Sets the website icon -->
    
    <title>HTML Meta Tags and SEO</title>
</head>
<body>
     <h1>Html Meta Tags and SEO Basics</h1>
</body>
</html>
