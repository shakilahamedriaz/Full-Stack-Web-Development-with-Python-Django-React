<!--
An <iframe> (Inline Frame) in HTML is used to embed another webpage within a webpage.

Key Points:
Displays external content like websites, videos, maps, etc.

Commonly used for embedding YouTube videos, Google Maps, and ads.

Important Attributes:
src – URL of the embedded page.
width & height – Set dimensions.

frameborder="0" – Removes border.

allowfullscreen – Enables fullscreen mode.

It's useful but can have security risks if misused (e.g., clickjacking).
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     
     <iframe src="https://ostad.app/" frameborder="10" width="600" height="600" allowfullscreen></iframe>

      <iframe src="https://youtu.be/Lho-MO_jxWM?si=OnFD8IQRSYHn-p4" frameborder="1" width="600" height="800"></iframe>
      




      
</body>
</html>
