{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto bg-white rounded-lg shadow-md p-8">
    <h2 class="text-3xl font-bold mb-4">{{ task.title }}</h2>
    <p class="text-gray-600 mb-4">{{ task.description }}</p>
    <div class="grid grid-cols-2 gap-4 text-sm text-gray-500 mb-6">
        <p><span class="font-semibold">Due Date:</span> {{ task.due_date|date:"F d, Y" }}</p>
        <p><span class="font-semibold">Status:</span> {{ task.status }}</p>
        <p><span class="font-semibold">Category:</span> {{ task.category }}</p>
    </div>
    <div class="flex justify-end">
        <a href="{% url 'task_list' %}" class="text-gray-600 hover:text-indigo-600 mr-4">Back to List</a>
        <a href="{% url 'task_delete' task.id %}" class="text-red-500 hover:text-red-700">Delete</a>
    </div>
</div>
{% endblock %}
