<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskify</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a class="text-2xl font-bold text-gray-800" href="{% url 'task_list' %}">🚀 Taskify</a>
            <div>
                {% if user.is_authenticated %}
                    <a class="px-4 py-2 text-gray-700" href="{% url 'logout' %}">Logout</a>
                {% else %}
                    <a class="px-4 py-2 text-gray-700" href="{% url 'login' %}">Login</a>
                    <a class="px-4 py-2 text-white bg-indigo-600 rounded-md" href="{% url 'register' %}">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white shadow-md mt-8">
        <div class="container mx-auto px-6 py-4 text-center text-gray-600">
            <p>&copy; 2025 Taskify. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
