{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}{% if edit %}Edit Student{% else %}Create Student{% endif %}{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6">
      {% if edit %}
        <h1 class="py-3 text-center">Edit Student Data</h1>
      {% else %}
        <h1 class="py-3 text-center">Create New Student</h1>
      {% endif %}

      <form method="post" enctype="multipart/form-data" novalidate>
        {% csrf_token %}
        {{ form | crispy }}
        <button type="submit" class="btn btn-primary w-100">Submit</button>
      </form>
    </div>
  </div>
{% endblock %}
