{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="d-flex justify-content-center align-items-center min-vh-100 bg-light">
    <div class="card shadow-lg p-5" style="width: 30rem;">
        <h2 class="text-center mb-4 text-primary">📝 Create a New User Account</h2>
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-warning w-100 mt-3">Sign Up</button>
        </form>
    </div>
</div>
{% endblock %}
