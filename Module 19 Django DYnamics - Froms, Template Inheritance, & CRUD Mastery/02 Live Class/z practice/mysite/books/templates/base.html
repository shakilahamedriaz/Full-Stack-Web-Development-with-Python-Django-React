<!-- books/templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Book Management{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Inter font for a modern look */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Light gray background */
        }
        /* Custom styles for subtle rounded corners and shadows */
        .card {
            border-radius: 0.75rem; /* rounded-xl */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); /* shadow-md */
        }
        .btn {
            border-radius: 0.5rem; /* rounded-lg */
            transition: all 0.2s ease-in-out;
        }
        .btn:hover {
            transform: translateY(-1px);
        }
        .message-box {
            border-radius: 0.5rem;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .message-box button {
            background: none;
            border: none;
            font-size: 1.25rem;
            cursor: pointer;
            color: inherit;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <header class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center px-4 sm:px-6 lg:px-8">
            <a href="{% url 'book-list' %}" class="text-3xl font-bold tracking-tight">BookVault</a>
            <nav>
                <ul class="flex space-x-6">
                    <li><a href="{% url 'book-list' %}" class="hover:text-blue-200 text-lg font-medium">Books</a></li>
                    <li><a href="{% url 'book-create' %}" class="hover:text-blue-200 text-lg font-medium">Add Book</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container mx-auto p-4 sm:p-6 lg:p-8 flex-grow">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message-box {% if message.tags == 'success' %}bg-green-100 text-green-800 border-green-400{% elif message.tags == 'error' %}bg-red-100 text-red-800 border-red-400{% elif message.tags == 'info' %}bg-blue-100 text-blue-800 border-blue-400{% else %}bg-gray-100 text-gray-800 border-gray-400{% endif %} border-l-4" role="alert">
                        <p>{{ message }}</p>
                        <button type="button" onclick="this.parentElement.style.display='none';">&times;</button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-800 text-white py-6 mt-8">
        <div class="container mx-auto text-center px-4 sm:px-6 lg:px-8">
            <p>&copy; 2024 BookVault. All rights reserved.</p>
            <p class="text-sm mt-2">Designed with ❤️ using Django & Tailwind CSS</p>
        </div>
    </footer>
</body>
</html>
