{% extends 'base.html' %}

{% block title %}Delete Book - BookVault{% endblock %}

{% block content %}
<div class="bg-white p-6 md:p-8 card max-w-xl mx-auto text-center">
    <h1 class="text-3xl font-extrabold text-gray-900 mb-6">Confirm Deletion</h1>
    <p class="text-xl text-gray-700 mb-8">Are you sure you want to delete the book: <br><span class="font-bold text-blue-600">"{{ book.title }}"</span> by <span class="font-bold text-blue-600">{{ book.author }}</span>?</p>

    <form method="post" class="flex justify-center space-x-6">
        {% csrf_token %}
        <a href="{% url 'book-list' %}" class="inline-flex items-center px-8 py-3 bg-gray-200 text-gray-800 text-lg font-semibold btn hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-opacity-50">
            Cancel
        </a>
        <button type="submit" class="inline-flex items-center px-8 py-3 bg-red-600 text-white text-lg font-semibold btn hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-opacity-50">
            Yes, Delete
        </button>
    </form>
</div>
{% endblock %}
