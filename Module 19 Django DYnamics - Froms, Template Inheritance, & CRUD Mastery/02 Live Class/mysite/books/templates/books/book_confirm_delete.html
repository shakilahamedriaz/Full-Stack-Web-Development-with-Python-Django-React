{% extends 'base.html' %}

{% block title %}
    Confirm Delete
{% endblock %}

{% block content %}
<div class="d-flex justify-content-center">
    <div class="card p-4 shadow" style="width: 40rem;">
        <h2 class="text-center mb-4 text-danger">⚠️ Confirm Delete</h2>

        <p class="text-center fs-5">Are you sure you want to delete <strong>{{ object.title }}</strong> by {{ object.author }}?</p>

        <form method="POST">
            {% csrf_token %}

            <div class="d-flex justify-content-center gap-3">
                <button type="submit" class="btn btn-danger btn-lg">Yes, Delete</button>
                <a href="{% url 'book-list' %}" class="btn btn-secondary btn-lg">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
